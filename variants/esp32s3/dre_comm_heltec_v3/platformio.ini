; DRE-Comm firmware for Heltec WiFi LoRa 32 V3 hardware.
; Reports as HELTEC_V3 (hw model 43) so the stock Meshtastic apps show the right device image.
[env:dre-comm-heltec-v3]
custom_meshtastic_hw_model = 43
custom_meshtastic_hw_model_slug = HELTEC_V3
custom_meshtastic_architecture = esp32-s3
custom_meshtastic_actively_supported = true
custom_meshtastic_support_level = 1
custom_meshtastic_display_name = DRE-Comm (Heltec V3)
custom_meshtastic_images = heltec-v3.svg, heltec-v3-case.svg
custom_meshtastic_tags = DRE-Comm
custom_meshtastic_partition_scheme = 8MB

extends = esp32s3_base
board = heltec_wifi_lora_32_V3
board_build.partitions = default_8MB.csv
build_flags =
  ${esp32s3_base.build_flags}
  -D HELTEC_V3
  -D DRE_COMM
  -I variants/esp32s3/dre_comm_heltec_v3
