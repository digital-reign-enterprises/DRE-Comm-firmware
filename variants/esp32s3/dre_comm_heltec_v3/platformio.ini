; DRE-Comm firmware for Heltec WiFi LoRa 32 V3.
; Extends Meshtastic's heltec-v3 env and reports the same hardware model, so the Meshtastic apps show the right device.
[env:dre-comm-heltec-v3]
extends = env:heltec-v3
board_level = extra
custom_meshtastic_display_name = DRE-Comm (Heltec V3)
custom_meshtastic_tags = DRE-Comm
; Our include path goes first so this folder's variant.h (base pins + DRE-Comm branding) wins
build_flags =
  -I variants/esp32s3/dre_comm_heltec_v3
  ${env:heltec-v3.build_flags}
  -D DRE_COMM
