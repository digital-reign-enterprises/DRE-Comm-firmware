; DRE-Comm firmware for Heltec Wireless Stick V3 / V3.1 (0.49" 64x32 OLED).
; Meshtastic has no stock build for this board. It shares the WiFi LoRa 32 V3 pinout, so this extends
; Meshtastic's heltec-v3 env and reports as HELTEC_V3; the apps show it as a Heltec V3.
[env:dre-comm-heltec-wireless-stick-v3]
extends = env:heltec-v3
board_level = extra
custom_meshtastic_display_name = DRE-Comm (Heltec Wireless Stick V3)
custom_meshtastic_tags = DRE-Comm
; Our include path goes first so this folder's variant.h (V3 pins + tiny screen + DRE-Comm branding) wins
build_flags =
  -I variants/esp32s3/dre_comm_heltec_wireless_stick_v3
  ${env:heltec-v3.build_flags}
  -D DRE_COMM
