; DRE-Comm firmware for LILYGO T-Deck, classic Meshtastic screens.
; Extends Meshtastic's t-deck env and reports the same hardware model, so the Meshtastic apps show the right device.
[env:dre-comm-t-deck]
extends = env:t-deck
board_level = extra
custom_meshtastic_display_name = DRE-Comm (LILYGO T-Deck)
custom_meshtastic_tags = DRE-Comm
; Our include path goes first so this folder's variant.h (base pins + DRE-Comm branding) wins
build_flags =
  -I variants/esp32s3/dre_comm_t_deck
  ${env:t-deck.build_flags}
  -D DRE_COMM

; LILYGO T-Deck with the touchscreen color UI. Its boot screen comes from meshtastic/device-ui,
; so the DRE-Comm logo is not shown yet; the rest of the DRE-Comm build applies.
[env:dre-comm-t-deck-tft]
extends = env:t-deck-tft
board_level = extra
custom_meshtastic_display_name = DRE-Comm (LILYGO T-Deck, touchscreen UI)
custom_meshtastic_tags = DRE-Comm
build_flags =
  -I variants/esp32s3/dre_comm_t_deck
  ${env:t-deck-tft.build_flags}
  -D DRE_COMM
