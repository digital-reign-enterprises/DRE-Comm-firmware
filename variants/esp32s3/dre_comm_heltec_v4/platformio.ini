; DRE-Comm firmware for Heltec WiFi LoRa 32 V4 (OLED).
; Extends Meshtastic's heltec-v4 env and reports the same hardware model, so the Meshtastic apps show the right device.
; Not yet tested on hardware (DRE has no V4 units yet).
[env:dre-comm-heltec-v4]
extends = env:heltec-v4
board_level = extra
custom_meshtastic_display_name = DRE-Comm (Heltec V4)
custom_meshtastic_tags = DRE-Comm
; Our include path goes first so this folder's variant.h (base pins + DRE-Comm branding) wins
build_flags =
  -I variants/esp32s3/dre_comm_heltec_v4
  ${env:heltec-v4.build_flags}
  -D DRE_COMM
