; DRE-Comm firmware for Heltec Wireless Tracker V2.
; Extends Meshtastic's heltec-wireless-tracker-v2 env and reports the same hardware model, so the Meshtastic apps show the right device.
[env:dre-comm-heltec-wireless-tracker-v2]
extends = env:heltec-wireless-tracker-v2
board_level = extra
custom_meshtastic_display_name = DRE-Comm (Heltec Wireless Tracker V2)
custom_meshtastic_tags = DRE-Comm
; Our include path goes first so this folder's variant.h (base pins + DRE-Comm branding) wins
build_flags =
  -I variants/esp32s3/dre_comm_heltec_wireless_tracker_v2
  ${env:heltec-wireless-tracker-v2.build_flags}
  -D DRE_COMM
