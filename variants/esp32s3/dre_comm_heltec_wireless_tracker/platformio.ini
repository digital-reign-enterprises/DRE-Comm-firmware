; DRE-Comm firmware for Heltec Wireless Tracker V1.1.
; Extends Meshtastic's heltec-wireless-tracker env and reports the same hardware model, so the Meshtastic apps show the right device.
[env:dre-comm-heltec-wireless-tracker]
extends = env:heltec-wireless-tracker
board_level = extra
custom_meshtastic_display_name = DRE-Comm (Heltec Wireless Tracker V1.1)
custom_meshtastic_tags = DRE-Comm
; Our include path goes first so this folder's variant.h (base pins + DRE-Comm branding) wins
build_flags =
  -I variants/esp32s3/dre_comm_heltec_wireless_tracker
  ${env:heltec-wireless-tracker.build_flags}
  -D DRE_COMM
